[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — semua route (kecuali file statis) diarahkan ke index.html
# supaya Vue Router (history mode) menangani routing di sisi client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
